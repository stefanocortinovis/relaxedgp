# @package _global_
experiment_name: sweeps
experiment_question: "sweeps for elevators dataset"

debug:
  grad_Z: true
  movement_Z: true
eval:
  log_wandb: true

model:
  kernel_name: squared_exponential
  init_Z_method: kmeans
  preconditioner: inv

training:
  adam_lr: 5e-3
  batch_size: 100
  n_iter: 20000
  train_Z: true

defaults:
  - override /dataset: elevators

hydra:
  mode: MULTIRUN
  sweep:
    dir: hydra/${experiment_name}/${dataset.name}
    subdir: ${model.name}/${model.M}/${model.kernel_name}/${training.train_Z}/${training.adam_lr}/${seed}/${now:%Y-%m-%d}/${now:%H-%M-%S}/
  sweeper:
    params:
      +model.name: lsvgp
      ++model.M: 1000,2000,3000,4000
